services:
  - type: web
    name: puyo-lavalust-api
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: DB_DRIVER
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        value: ca.pem
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: http://localhost:5173
